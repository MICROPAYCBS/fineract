ext {
    fineractQuickBuildSkippedTaskNames = [
            'test',
            'testClasses',
            'compileTestJava',
            'processTestResources',
            'check',
            'checkstyle',
            'checkstyleMain',
            'checkstyleTest',
            'spotlessCheck',
            'spotlessApply',
            'spotbugsMain',
            'spotbugsTest',
            'javadoc',
            'javadocJar',
            'modernizer',
            'modernizerMain',
            'modernizerTest',
            'rat',
            'licenseMain',
            'licenseTest',
            'cucumber',
            'checkBreakingChanges',
            'jacocoTestReport'
    ]
}

gradle.taskGraph.whenReady { graph ->
    if (!graph.allTasks.any { it.name == 'quickBootJar' }) {
        return
    }

    logger.lifecycle('quickBootJar: skipping tests and quality checks; compileJava and bootJar will still run')

    rootProject.fineractJavaProjects.each { subproject ->
        subproject.tasks.matching { task ->
            task.name in fineractQuickBuildSkippedTaskNames ||
                    task.name.startsWith('spotless') ||
                    task.name.startsWith('checkstyle') ||
                    task.name.startsWith('spotbugs')
        }.configureEach {
            enabled = false
        }

        subproject.tasks.withType(JavaCompile).configureEach {
            options.errorprone.enabled = false
        }
    }
}

tasks.register('quickBootJar') {
    group = 'build'
    description = 'Builds the executable bootJar after compileJava, skipping tests and quality checks.'
    dependsOn ':fineract-provider:quickBootJar'
}

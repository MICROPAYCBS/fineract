# Deployment-wide switch for the Micropay treasury module.
fineract.module.treasury.enabled=${FINERACT_MODULE_TREASURY_ENABLED:true}
# The base (reporting) currency of FX revaluation and positions, and the oldest a closing rate may be for revaluation.
fineract.module.treasury.base-currency=${FINERACT_TREASURY_BASE_CURRENCY:UGX}
fineract.module.treasury.fx.max-rate-age-days=${FINERACT_TREASURY_FX_MAX_RATE_AGE_DAYS:3}

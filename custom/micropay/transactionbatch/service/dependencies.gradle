dependencies {
    implementation(project(':fineract-core'))
    implementation(project(':fineract-accounting'))
    implementation(project(':fineract-savings'))
    implementation(project(':fineract-provider'))
    implementation(project(':custom:micropay:platform:core'))
    implementation(project(':custom:micropay:infrastructure:service'))
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework.boot:spring-boot-starter-security')
    implementation('jakarta.ws.rs:jakarta.ws.rs-api')
    implementation('org.glassfish.jersey.media:jersey-media-multipart')
    implementation('com.google.code.gson:gson')
    implementation('org.apache.commons:commons-lang3')
    implementation('org.apache.commons:commons-csv:1.14.1')
    implementation('org.apache.poi:poi-ooxml') {
        exclude group: 'org.apache.poi', module: 'poi-ooxml-lite'
    }
    implementation('io.swagger.core.v3:swagger-annotations-jakarta')
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa') { exclude group: 'org.hibernate' }
    implementation('org.eclipse.persistence:org.eclipse.persistence.jpa') { exclude group: 'org.eclipse.persistence', module: 'jakarta.persistence' }
    compileOnly('com.github.spotbugs:spotbugs-annotations')
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'com.jayway.jsonpath', module: 'json-path'
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        exclude group: 'jakarta.activation'
        exclude group: 'javax.activation'
        exclude group: 'org.skyscreamer'
    }
}

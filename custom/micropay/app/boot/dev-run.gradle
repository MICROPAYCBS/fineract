// Development entry point for the Micropay distribution.
//
//   ./gradlew :custom:micropay:app:boot:devRun
//
// Same classpath as bootRun (fineract-provider + every custom/micropay/** module) but with tests and
// quality checks disabled, mirroring :fineract-provider:devRun.

// Script plugins cannot resolve the Boot plugin classes by name; reuse the type of the existing bootRun task
// (unwrapping Gradle's generated "_Decorated" subclass).
def bootRunType = bootRun.class
while (bootRunType.simpleName.endsWith('_Decorated')) {
    bootRunType = bootRunType.superclass
}
tasks.register('devRun', bootRunType) {
    description = 'Runs the Micropay application quickly for development by skipping quality checks'
    group = 'Application'

    classpath = bootRun.classpath
    mainClass = bootRun.mainClass
    jvmArgs = bootRun.jvmArgs

    doFirst {
        println 'Running Micropay (fineract-provider + custom/micropay/**) in development mode - quality checks are disabled'
    }
}

gradle.taskGraph.whenReady { graph ->
    def micropayDevRun = graph.allTasks.any { it.name == 'devRun' && it.project.path == project.path }
    def micropayBootRun = graph.allTasks.any { it.name == 'bootRun' && it.project.path == project.path }
    if (micropayDevRun) {
        rootProject.fineractJavaProjects.each { subproject ->
            subproject.tasks.matching { task ->
                task.name in fineractQuickBuildSkippedTaskNames ||
                        task.name.startsWith('spotless') ||
                        task.name.startsWith('checkstyle') ||
                        task.name.startsWith('spotbugs')
            }.configureEach {
                enabled = false
            }
            subproject.tasks.withType(JavaCompile).configureEach {
                options.errorprone.enabled = false
            }
        }
    }
    // swagger-gradle-plugin resolve loads FineractOperationIdReader in the Gradle daemon JVM.
    // The toolchain compiles that class for JDK 25 (class file 69); a Java 21 daemon then fails
    // with UnsupportedClassVersionError. Local run does not need the generated OpenAPI files.
    if (micropayDevRun || micropayBootRun) {
        def resolveTask = graph.allTasks.find { it.name == 'resolve' && it.project.path == ':fineract-provider' }
        if (resolveTask != null) {
            resolveTask.enabled = false
            logger.lifecycle(':fineract-provider:resolve skipped for {}: swagger-gradle-plugin cannot load JDK 25 classes in a Java 21 Gradle daemon. Run the daemon on JDK 25 if you need the spec.',
                    micropayDevRun ? 'devRun' : 'bootRun')
        }
    }
}

// Guard: running the upstream provider directly starts Fineract WITHOUT the Micropay modules. Every moved
// endpoint (customer classes, sectors, job sequences, workflows, GL enquiry, ...) answers 404 and every
// Micropay service replacement is silently absent. Fail fast unless the caller explicitly asks for
// upstream-only Fineract with -PupstreamOnly.
def upstreamOnly = rootProject.hasProperty('upstreamOnly')
def guardMessage = { String taskPath ->
    "${taskPath} starts upstream Fineract without the custom/micropay/** modules. " +
            "Use :custom:micropay:app:boot:bootRun or :custom:micropay:app:boot:devRun instead, " +
            "or pass -PupstreamOnly to run upstream-only Fineract on purpose."
}
project(':fineract-provider').tasks.matching { it.name in ['bootRun', 'devRun'] }.configureEach { guarded ->
    guarded.doFirst {
        if (!upstreamOnly) {
            throw new GradleException(guardMessage(guarded.path))
        }
        logger.warn("{}: -PupstreamOnly set, starting upstream-only Fineract (no Micropay modules)", guarded.path)
    }
}

// An unqualified `gradlew devRun` / `gradlew bootRun` / `gradlew bootJar` from the repo root matches the task in
// BOTH projects and Gradle schedules the provider one first. The caller wants the Micropay distribution: skip the
// provider task instead of failing, and let :custom:micropay:app:boot:<task> run.
//
// `gradlew build` and `:fineract-provider:jib*` also schedule the provider bootJar, but not as the requested task.
// Those keep building the upstream jar so CI images and the full build are unchanged.
def taskLeaf = { String name -> name.contains(':') ? name.substring(name.lastIndexOf(':') + 1) : name }
def requestedTaskLeaves = gradle.startParameter.taskNames.collect { taskLeaf(it) }
gradle.taskGraph.whenReady { graph ->
    ['bootRun', 'devRun', 'bootJar'].each { name ->
        if (!requestedTaskLeaves.contains(name) || upstreamOnly) {
            return
        }
        def bootTask = graph.allTasks.find { it.name == name && it.project.path == project.path }
        def providerTask = graph.allTasks.find { it.name == name && it.project.path == ':fineract-provider' }
        if (bootTask != null && providerTask != null) {
            providerTask.enabled = false
            logger.lifecycle("{} skipped: {} is the Micropay distribution (custom/micropay/** included). " +
                    "The upstream jar has none of those modules, so replacements such as the prepay quote are absent.",
                    providerTask.path, bootTask.path)
        }
    }
}

project(':fineract-provider').tasks.named('bootJar').configure { providerBootJar ->
    providerBootJar.doLast {
        // jib and `gradlew build` depend on this task without the caller asking for a runnable jar.
        def explicitlyRequested = gradle.startParameter.taskNames.any { String name ->
            taskLeaf(name) == 'bootJar' && name.contains('fineract-provider')
        }
        if (upstreamOnly || !explicitlyRequested) {
            return
        }
        logger.warn("{} is upstream-only. It does not contain custom/micropay/**. " +
                "Run java -jar custom/micropay/app/boot/build/libs/micropay-fineract-boot-{}.jar " +
                "(built by :custom:micropay:app:boot:bootJar). Pass -PupstreamOnly if this jar is intentional.",
                providerBootJar.path, project.version)
    }
}

dependencies {
    implementation(project(':fineract-core'))
    implementation(project(':fineract-provider'))

    // NOTE: every custom/micropay/<category>/<module> except this one is pulled in automatically
    file("${rootDir}/custom/micropay").eachDir { categoryDir ->
        if ('build' != categoryDir.name) {
            file("${rootDir}/custom/micropay/${categoryDir.name}").eachDir { moduleDir ->
                def path = ":custom:micropay:${categoryDir.name}:${moduleDir.name}"
                if ('build' != moduleDir.name && path != project.path) {
                    implementation project(path)
                }
            }
        }
    }

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'com.mysql:mysql-connector-j'
}

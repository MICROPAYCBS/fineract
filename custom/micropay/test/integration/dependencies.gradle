evaluationDependsOn(':integration-tests')
def integrationTestsProject = rootProject.project(':integration-tests')

dependencies {
    testImplementation project(path: ':fineract-client', configuration: 'runtimeElements')
    testImplementation(project(path: ':fineract-client-feign', configuration: 'runtimeElements')) {
        exclude group: 'org.apache.fineract', module: 'fineract-client'
    }
    testImplementation files(integrationTestsProject.sourceSets.test.output)
    testImplementation integrationTestsProject.sourceSets.test.runtimeClasspath
    testImplementation ('io.rest-assured:rest-assured') {
        exclude group: 'commons-logging'
        exclude group: 'org.apache.sling'
        exclude group: 'com.sun.xml.bind'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'com.google.code.gson:gson'
    testImplementation 'com.google.guava:guava'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

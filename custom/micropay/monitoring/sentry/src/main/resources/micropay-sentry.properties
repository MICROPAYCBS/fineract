# Sentry defaults for the Micropay deployment - see https://docs.sentry.io/platforms/java/guides/spring-boot/
# Issues (exceptions) land in Sentry "Issues". Log forwarding needs sentry.logs.enabled=true.
# Any of these can be overridden from application.properties, environment variables or system properties.
sentry.dsn=${SENTRY_DSN:}
sentry.enabled=${SENTRY_ENABLED:true}
sentry.debug=${SENTRY_DEBUG:false}
sentry.environment=${SENTRY_ENVIRONMENT:${spring.profiles.active:local}}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.send-default-pii=false
sentry.logging.enabled=${SENTRY_LOGGING_ENABLED:true}
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info
sentry.logs.enabled=${SENTRY_LOGS_ENABLED:false}

description = 'Micropay Fraud Scoring Engine (standalone service, not part of the Fineract distribution)'

group = 'com.micropay.fraud'

// Runs beside Fineract: reads its external events from Kafka, scores every transaction and keeps alerts for the
// fraud dashboard. app/boot skips this module (see FRAUD_ENGINE note there), so nothing here loads inside Fineract.
//
//   ./gradlew :custom:micropay:fraud:engine:bootRun
//   ./gradlew :custom:micropay:fraud:engine:bootJar     # build/libs/micropay-fraud-engine-<version>.jar

apply plugin: 'org.springframework.boot'

base {
    archivesName = 'micropay-fraud-engine'
}

apply from: 'dependencies.gradle'

springBoot {
    mainClass = 'com.micropay.fraud.engine.FraudEngineApplication'
}

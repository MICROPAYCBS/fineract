# Micropay fraud engine settings. Every value can be overridden with an environment variable of the same name in
# upper case (for example FRAUD_ALERTS_THRESHOLD, FRAUD_API_KEY, SPRING_DATASOURCE_URL).

server.port=${FRAUD_ENGINE_PORT:8090}
spring.application.name=micropay-fraud-engine

# The engine's own database (PostgreSQL), not Fineract's
spring.datasource.url=${FRAUD_DB_URL:jdbc:postgresql://localhost:5432/fraud_engine}
spring.datasource.username=${FRAUD_DB_USERNAME:fraud_engine}
spring.datasource.password=${FRAUD_DB_PASSWORD:}
spring.liquibase.change-log=classpath:db/fraud-engine/changelog.xml

# Fineract's external events topic (fineract.events.external.producer.kafka.topic.name)
spring.kafka.bootstrap-servers=${FRAUD_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.listener.ack-mode=record
fraud.kafka.topic=${FRAUD_KAFKA_TOPIC:external-events}
fraud.kafka.group-id=${FRAUD_KAFKA_GROUP_ID:fraud-engine}
fraud.kafka.enabled=${FRAUD_KAFKA_ENABLED:true}

fraud.time-zone=${FRAUD_TIME_ZONE:Africa/Kampala}
fraud.api.key=${FRAUD_API_KEY:}

# Scores run 0 to 100
fraud.alerts.threshold=${FRAUD_ALERTS_THRESHOLD:40}
fraud.alerts.medium-from=60
fraud.alerts.high-from=80

# Smallest amount worth an alert, per currency
fraud.rules.material-amount.UGX=1000000
fraud.rules.material-amount.KES=40000
fraud.rules.material-amount.USD=300
fraud.rules.material-amount.DEFAULT=1000000
# Large transaction reporting limit that structuring stays under. CONFIRM the UGX value with compliance.
fraud.rules.reporting-threshold.UGX=20000000
fraud.rules.reporting-threshold.KES=1000000
fraud.rules.reporting-threshold.USD=10000
fraud.rules.reporting-threshold.DEFAULT=20000000

# Fineract API, used to find the client behind an account and, with auto-hold, to place holds
fraud.fineract.enabled=${FRAUD_FINERACT_ENABLED:false}
fraud.fineract.base-url=${FRAUD_FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api/v1}
fraud.fineract.username=${FRAUD_FINERACT_USERNAME:}
fraud.fineract.password=${FRAUD_FINERACT_PASSWORD:}

# Off by default: alert, do not block
fraud.auto-hold.enabled=${FRAUD_AUTO_HOLD_ENABLED:false}
fraud.auto-hold.min-score=90

tasks.register('copyDatabaseDriverPlugins', Copy) {
    description = 'Copies configured JDBC drivers into the Docker plugin directory.'

    from {
        configurations.driver.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group != 'org.postgresql'
        }.collect { it.file }
    }

    into rootProject.layout.buildDirectory.dir('fineract/plugins')
}


description = 'Fineract Provider'

apply plugin: 'org.zeroturnaround.gradle.jrebel'
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'org.springframework.boot'
apply plugin: 'com.gorylenko.gradle-git-properties'
apply plugin: 'io.swagger.core.v3.swagger-gradle-plugin'
apply plugin: 'com.google.cloud.tools.jib'
apply plugin: 'org.springframework.boot'
apply plugin: 'se.thinkcode.cucumber-runner'
apply plugin: 'com.docktape.swagger-brake'

swaggerBrake {
    newApi = findProperty('apiNew') ?:"${project.buildDir}/resources/main/static/fineract.json"
    oldApi = findProperty('apiBaseline') ?: "${projectDir}/config/swagger/fineract-baseline.json"
    outputFormats = ['JSON']
    outputFilePath = "${project.buildDir}/swagger-brake"
    deprecatedApiDeletionAllowed = true
    strictValidation = false
}

checkBreakingChanges.onlyIf {
    def baseline = findProperty('apiBaseline') ?: "${projectDir}/config/swagger/fineract-baseline.json"
    def exists = file(baseline).exists()
    if (!exists) {
        logger.lifecycle("Skipping checkBreakingChanges: baseline file not found at ${baseline}")
    }
    def apiNew = findProperty('apiNew') ?: "${project.buildDir}/resources/main/static/fineract.json"
    def existsApiNew = file(apiNew).exists()
    if (!existsApiNew) {
        logger.lifecycle("Skipping checkBreakingChanges: new api file not found at ${apiNew}")
    }
    exists && existsApiNew
}

check.dependsOn('cucumber')

// Static weaving is now configured in gradle/static-weaving.gradle
// This ensures consistent configuration across all modules with JPA entities

// Add dependency on avro schemas
compileJava {
    dependsOn ':fineract-avro-schemas:buildJavaSdk'
}

// Configuration for Swagger documentation generation task
// https://github.com/swagger-api/swagger-core/tree/master/modules/swagger-gradle-plugin
import org.apache.tools.ant.filters.ReplaceTokens

tasks.register('prepareInputYaml') {
    outputs.file("${buildDir}/tmp/swagger/fineract-input.yaml")

    doLast {
        copy {
            from file("${projectDir}/config/swagger/fineract-input.yaml.template")
            into file("${buildDir}/tmp/swagger")
            rename { String filename -> return 'fineract-input.yaml' }
            filter(ReplaceTokens, tokens: [VERSION: "${project.version}".toString()])
        }
    }
}

resolve {
    logging.captureStandardOutput LogLevel.INFO
    outputFileName = 'fineract'
    outputFormat = 'JSONANDYAML'
    prettyPrint = false
    classpath = sourceSets.main.runtimeClasspath
    buildClasspath = classpath
    outputDir = file("${buildDir}/resources/main/static")
    openApiFile = file("${buildDir}/tmp/swagger/fineract-input.yaml")
    readerClass = 'org.apache.fineract.infrastructure.openapi.FineractOperationIdReader'
    sortOutput = true
    dependsOn(prepareInputYaml, classes)
}

